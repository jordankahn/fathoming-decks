<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Fathoming — Decks</title>
<link rel="stylesheet" href="sinful-shadows/fonts/fonts.css">
<style>
  :root { --void: #070504; --gold: #c9a84c; --gold-2: #e6cc7a; --ink: #ece2c8; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 56px; padding: 64px 24px; color: var(--ink); font-family: 'IM Fell English', Georgia, serif;
    background: radial-gradient(1200px 700px at 50% 0%, #2a120e, var(--void) 70%) var(--void);
  }
  .logo { width: min(520px, 80vw); height: auto; filter: drop-shadow(0 6px 24px #000); }
  h1 { margin: 0; font-family: 'Cinzel', serif; font-weight: 700; font-size: 20px; letter-spacing: .5em; text-transform: uppercase; color: var(--gold); }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 28px; width: min(760px, 100%); }
  a.deck {
    display: grid; grid-template-columns: 220px 1fr; gap: 32px; align-items: center; padding: 28px 32px;
    color: inherit; text-decoration: none; border: 1px solid rgba(201, 168, 76, .4);
    background: linear-gradient(90deg, rgba(179, 38, 30, .22), rgba(7, 5, 4, .4));
    transition: border-color .2s, transform .2s, box-shadow .2s;
  }
  a.deck:hover, a.deck:focus-visible { border-color: var(--gold-2); transform: translateY(-3px); box-shadow: 0 18px 40px -18px #000, 0 0 40px -12px var(--gold); outline: none; }
  a.deck img { width: 100%; height: auto; display: block; }
  a.deck b { display: block; font-family: 'Cinzel', serif; font-weight: 700; font-size: 26px; letter-spacing: .06em; color: var(--gold-2); }
  a.deck span { display: block; margin-top: 8px; font-size: 20px; font-style: italic; opacity: .8; }
  @media (max-width: 600px) { a.deck { grid-template-columns: 1fr; text-align: center; } a.deck img { max-width: 240px; margin: 0 auto; } }
</style>
</head>
<body>
  <img class="logo" src="sinful-shadows/img/fathoming-logo-line.png" width="1400" height="326" alt="The Fathoming">
  <h1>Decks</h1>
  <ul>
    <li>
      <a class="deck" href="sinful-shadows/index.html">
        <img src="sinful-shadows/img/sinful-shadows-logo.svg" width="342" height="166" alt="">
        <div><b>Sinful Shadows</b><span>Expansion release event: rules refresher and the new set.</span></div>
      </a>
    </li>
  </ul>
</body>
</html>
